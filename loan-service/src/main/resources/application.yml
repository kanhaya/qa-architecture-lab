server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: loan-service
  profiles:
    active: ${APP_ENV:local}

app:
  env: ${APP_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
