openapi: 3.0.3
info:
  title: Loan Service API
  version: 1.0.0
  description: Contract for the QA Architecture Lab loan-service HTTP API.
servers:
  - url: /
paths:
  /api/loans:
    get:
      operationId: getAllLoans
      summary: List all loans
      responses:
        "200":
          description: Loans returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      operationId: createLoan
      summary: Create a loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequest"
      responses:
        "201":
          description: Loan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/loans/{id}:
    get:
      operationId: getLoanById
      summary: Get a loan by id
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "200":
          description: Loan found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLoan
      summary: Delete a loan
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "204":
          description: Loan deleted
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/loans/{id}/status:
    put:
      operationId: updateLoanStatus
      summary: Update loan status
      parameters:
        - $ref: "#/components/parameters/LoanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoanStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /actuator/health:
    get:
      operationId: health
      summary: Application health
      responses:
        "200":
          description: Health is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  parameters:
    LoanId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    LoanStatus:
      type: string
      enum:
        - PENDING
        - APPROVED
        - REJECTED
    Loan:
      type: object
      additionalProperties: false
      required:
        - id
        - customerName
        - amount
        - status
      properties:
        id:
          type: integer
          format: int64
        customerName:
          type: string
        amount:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/LoanStatus"
    CreateLoanRequest:
      type: object
      additionalProperties: false
      required:
        - customerName
        - amount
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000
    UpdateLoanStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/LoanStatus"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - timestamp
        - status
        - error
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    HealthResponse:
      type: object
      additionalProperties: true
      required:
        - status
      properties:
        status:
          type: string
        groups:
          type: array
          items:
            type: string
